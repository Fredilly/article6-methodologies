name: vm0048-build-runner
on:
  push:
    branches:
      - governance/vm0048-v1-0-ingestion
    paths:
      - '.github/workflows/vm0048-build-runner.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vm0048-v1-0-ingestion
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.11.1'
      - name: Run corrected embedded builder
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/vm0048-build-bootstrap.yml').read_text().splitlines()
          start=None; end=None
          for i,line in enumerate(src):
              if line.strip() == '- name: Build VM0048 v1.0 governed corpus':
                  start=i
              elif start is not None and line.strip() == '- name: Validate generated VM0048 package':
                  end=i
                  break
          if start is None or end is None: raise SystemExit('builder block not found')
          run_idx=next(i for i in range(start,end) if src[i].strip()=='run: |')
          body=[]
          for line in src[run_idx+1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(body)+'\n'
          old="""def R(sec,summary,logic,typ,start,when=None,tags=None,source='main',tools=None):\n    specs.append(dict(sec=sec,summary=summary,logic=logic,typ=typ,start=start,when=when or [],tags=tags or [typ],source=source,tools=tools or []))"""
          new="""def R(sec,summary,logic,typ,start,when=None,tags=None,source='main',tools=None):\n    canonical_type = {\n      'documentation':'reporting','applicability':'eligibility','definition':'parameter','boundary':'eligibility',\n      'quantification':'calc','consistency':'eligibility','baseline':'calc','dependency':'eligibility',\n      'issuance':'calc','additionality':'eligibility','transition':'eligibility','prohibition':'eligibility',\n      'significance':'calc'\n    }.get(typ, typ)\n    specs.append(dict(sec=sec,summary=summary,logic=logic,typ=canonical_type,start=start,when=when or [],tags=tags or [typ],source=source,tools=tools or []))"""
          if old not in script: raise SystemExit('R function target not found')
          Path('/tmp/vm0048-build.sh').write_text(script.replace(old,new))
          PY
          bash /tmp/vm0048-build.sh
      - name: Validate generated package
        run: |
          set -euo pipefail
          npm ci || npm i
          npm run validate:rich
          npm run validate:lean
          node scripts/derive-lean-from-rich.js methodologies/Verra/AFOLU/VM0048/v1-0
          git diff --exit-code -- methodologies/Verra/AFOLU/VM0048/v1-0/sections.json methodologies/Verra/AFOLU/VM0048/v1-0/rules.json
      - name: Commit corpus only
        run: |
          set -euo pipefail
          git config user.name 'article6-governance-bot'
          git config user.email 'fredilly@article6.org'
          git add methodologies/Verra/AFOLU/VM0048/v1-0 governance/Verra/AFOLU/VM0048/v1-0 docs/roadmaps/governance-v1/staging/VM0048/v1-0/content-inventory.json
          git commit -m 'Governance: ingest VM0048 v1.0 governed corpus'
          git push origin HEAD:governance/vm0048-v1-0-ingestion
