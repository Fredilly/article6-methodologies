name: vm0048-bootstrap-fix-types
on:
  push:
    branches:
      - governance/vm0048-v1-0-ingestion
    paths:
      - '.github/workflows/vm0048-bootstrap-fix-types.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vm0048-v1-0-ingestion
          fetch-depth: 0
      - name: Map semantic labels to canonical rule types
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/vm0048-build-bootstrap.yml')
          s=p.read_text()
          old="""          def R(sec,summary,logic,typ,start,when=None,tags=None,source='main',tools=None):\n              specs.append(dict(sec=sec,summary=summary,logic=logic,typ=typ,start=start,when=when or [],tags=tags or [typ],source=source,tools=tools or []))\n"""
          new="""          def R(sec,summary,logic,typ,start,when=None,tags=None,source='main',tools=None):\n              canonical_type = {\n                'documentation':'reporting','applicability':'eligibility','definition':'parameter','boundary':'eligibility',\n                'quantification':'calc','consistency':'eligibility','baseline':'calc','dependency':'eligibility',\n                'issuance':'calc','additionality':'eligibility','transition':'eligibility','prohibition':'eligibility',\n                'significance':'calc'\n              }.get(typ, typ)\n              specs.append(dict(sec=sec,summary=summary,logic=logic,typ=canonical_type,start=start,when=when or [],tags=tags or [typ],source=source,tools=tools or []))\n"""
          if old not in s: raise SystemExit('target function not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name 'article6-governance-bot'
          git config user.email 'fredilly@article6.org'
          git add .github/workflows/vm0048-build-bootstrap.yml
          git rm .github/workflows/vm0048-bootstrap-fix-types.yml
          git commit -m 'Governance: use canonical VM0048 rule types'
          git push origin HEAD:governance/vm0048-v1-0-ingestion
