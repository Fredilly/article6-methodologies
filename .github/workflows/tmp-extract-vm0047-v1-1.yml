name: Temporary VM0047 v1.1 canonical fold

on:
  push:
    branches:
      - gov-v1-vm0047-v1-1-10-canonical-content

permissions:
  contents: write

jobs:
  fold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Fold source-verified deep hierarchy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          root = Path('docs/roadmaps/governance-v1/staging/VM0047/v1-1')
          base = json.loads((root/'sections.json').read_text())['sections']
          deep = json.loads((root/'sections.deep.json').read_text())['sections']
          existing = {s['section_number']: s for s in base}
          def sid(n): return 'S-' + n.replace('.', '-').replace('A','A')
          for d in deep:
              n=d['section_number']
              if n in existing: continue
              i=sid(n)
              parent='S-' + d['parent'].replace('.', '-')
              existing[n]={
                'id':i,
                'stable_id':f'Verra.AFOLU.VM0047.v1-1.{i}',
                'title':d['title'],
                'section_number':n,
                'section_level':n.count('.')+1,
                'parent_id':parent,
                'page_start':d['page_start'],
                'page_end':d['page_end'],
                'locator_status':'source_verified'
              }
          def key(n):
              if n=='DH': return (99,)
              if n.startswith('A'):
                  p=n[1:].split('.')
                  return (90,)+tuple(int(x) for x in p)
              return tuple(int(x) for x in n.split('.'))
          sections=sorted(existing.values(), key=lambda s:key(s['section_number']))
          (root/'sections.json').write_text(json.dumps({'sections':sections}, indent=2)+'\n')
          lean=[{k:s[k] for k in ('id','stable_id','title','section_number','section_level','parent_id','page_start','page_end')} for s in sections]
          (root/'sections.lean.json').write_text(json.dumps({'component':'Verra/VM0047@v1-1','derived_from':'sections.json','sections':lean}, indent=2)+'\n')
          rich={
            'source':{
              'component':'Verra/VM0047@v1-1',
              'document':'VM0047 Afforestation, Reforestation, and Revegetation, v1.1',
              'governed_pdf':'tools/Verra/VM0047/v1-1/source.pdf',
              'source_text':'source/source.layout.txt',
              'sha256':'2fdccb9764a0b06283e974142d0ff250910f81686dc53bcc197f6cf90d53de3d',
              'page_count':81,
              'status':'source_verified_hierarchy'
            },
            'sections_file':'sections.json',
            'lean_sections_file':'sections.lean.json',
            'provenance_status':'SOURCE_REQUIREMENT',
            'hierarchy_complete':True,
            'deep_subsections_pending':False,
            'source_heading_audit_complete':True,
            'source_text_preserved':True,
            'section_count':len(sections),
            'note':'Rich section identity and hierarchy are canonical in sections.json; lean sections are derived. Full normative rule decomposition is tracked separately.'
          }
          (root/'sections.rich.json').write_text(json.dumps(rich, indent=2)+'\n')
          text=(root/'source/source.layout.txt').read_text(errors='replace')
          eq=sorted({int(x) for x in re.findall(r'Equation\s*\(?([0-9]{1,3})\)?', text, re.I)})
          params=[]
          for line in text.splitlines():
              m=re.match(r'^\s*Data / Parameter\s*:?\s*(.+?)\s*$', line, re.I)
              if m and m.group(1): params.append(m.group(1).strip())
          inv={
            'component':'Verra/VM0047@v1-1',
            'source':'source/source.layout.txt',
            'classification':'ARTICLE6_NORMALIZATION',
            'purpose':'Deterministic structural inventory only; not a substitute for semantic rule review.',
            'equation_references_detected':eq,
            'parameter_labels_detected':sorted(set(params)),
            'numbered_section_count':len(sections),
            'semantic_rule_review_complete':False
          }
          (root/'content-inventory.json').write_text(json.dumps(inv, indent=2)+'\n')
          PY
      - name: Commit canonical fold
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmaps/governance-v1/staging/VM0047/v1-1/sections.json \
                  docs/roadmaps/governance-v1/staging/VM0047/v1-1/sections.lean.json \
                  docs/roadmaps/governance-v1/staging/VM0047/v1-1/sections.rich.json \
                  docs/roadmaps/governance-v1/staging/VM0047/v1-1/content-inventory.json
          git commit -m "feat: fold VM0047 v1.1 canonical hierarchy"
          git push
