          import json, hashlib
          from pathlib import Path
          OUT=Path('methodologies/Verra/AFOLU/VM0048/v1-0'); GOV=Path('governance/Verra/AFOLU/VM0048/v1-0')
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          meta=json.loads((OUT/'META.json').read_text())
          paths=[OUT/'sections.json',OUT/'sections.rich.json',OUT/'rules.json',OUT/'rules.rich.json',GOV/'dependencies.governance-v1.json',GOV/'clarifications.governance-v1.json',GOV/'equations.governance-v1.json',GOV/'parameters.governance-v1.json',GOV/'rules.governance-v1.index.json']
