              if p.name in keymap: meta['audit_hashes'][keymap[p.name]]=h(p)
          meta['files']=[]
          for p in paths:
              if str(p).startswith(str(OUT)+'/'): rel=p.name
              else: rel=str(p)
              meta['files'].append({'path':rel,'sha256':h(p)})
          (OUT/'META.json').write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(meta['audit_hashes'],indent=2))
