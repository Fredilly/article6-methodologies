name: vm0048-registry-cleanup
on:
  push:
    branches:
      - governance/vm0048-v1-0-ingestion
    paths:
      - '.github/workflows/vm0048-registry-cleanup.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vm0048-v1-0-ingestion
          fetch-depth: 0
      - name: Rebuild registry from main plus VM0048 only
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:registry.json > /tmp/registry-main.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/registry-main.json')
          reg=json.loads(p.read_text())
          path='methodologies/Verra/AFOLU/VM0048/v1-0'
          if any(e.get('path') == path for e in reg):
              raise SystemExit('VM0048 unexpectedly already exists on main')
          reg.append({
            'kind':'active','standard':'Verra','program':'AFOLU','code':'VM0048','version':'1.0',
            'path':path,'stage':'staging','latest':True,
            'source_pdf':{'path':'tools/Verra/VM0048/v1-0/source.pdf','sha256':'d65f26b65946120688e5b41d7e97d116f6959fdd9d7a77f7643f5339a142b982'}
          })
          Path('registry.json').write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          PY
          node scripts/check-trio-and-registry.js
          git diff --unified=3 origin/main -- registry.json
      - name: Commit clean registry diff
        run: |
          git config user.name 'article6-governance-bot'
          git config user.email 'fredilly@article6.org'
          git add registry.json
          git commit -m 'Governance: keep VM0048 registry change isolated'
          git push origin HEAD:governance/vm0048-v1-0-ingestion
