name: Temporary VM0047 v1.1 source capture

on:
  push:
    branches:
      - gov-v1-vm0047-v1-1-09-govern-source-binary

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download authoritative source
        run: |
          set -euo pipefail
          mkdir -p tools/Verra/VM0047/v1-1
          curl --fail --location --retry 3 \
            https://verra.org/wp-content/uploads/2025/05/VM0047-v1.1_Final.pdf \
            --output tools/Verra/VM0047/v1-1/source.pdf
          test "$(stat -c%s tools/Verra/VM0047/v1-1/source.pdf)" = "1171574"
          echo "2fdccb9764a0b06283e974142d0ff250910f81686dc53bcc197f6cf90d53de3d  tools/Verra/VM0047/v1-1/source.pdf" | sha256sum --check --strict
      - name: Commit governed artifact
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/Verra/VM0047/v1-1/source.pdf
          git commit -m "feat: govern VM0047 v1.1 authoritative PDF"
          git push
