name: Temporary VM0047 structured retrieval integration

on:
  push:
    branches:
      - gov-v1-vm0047-v1-1-16-structured-retrieval

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Patch production HTTP adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bin/http-engine-adapter.js')
          s = p.read_text()
          require_line = "const { createGovernanceRetriever } = require('../lib/governance-retrieval');\n"
          if require_line not in s:
              marker = "const { URL } = require('url');\n"
              s = s.replace(marker, marker + require_line)
          old = "  const bm25 = buildBM25(documents);\n\n  function search(query, opts = {}) {"
          new = "  const bm25 = buildBM25(documents);\n  const governance = createGovernanceRetriever(ROOT);\n\n  function search(query, opts = {}) {"
          if old in s:
              s = s.replace(old, new)
          old_return = "  return { search, audit, documents };\n}"
          new_return = "  return { search, structured: governance.query, audit, documents };\n}"
          if old_return in s:
              s = s.replace(old_return, new_return)
          old_query = "    if (!parsed || typeof parsed.query !== 'string') {\n      sendJSON(res, 400, { error: 'InvalidRequest', message: 'Body must include string field \\\"query\\\"' });\n      return;\n    }\n    const requestedTopK = parsed.top_k;\n    const { results, audit, topK } = engine.search(parsed.query, { topK: requestedTopK });\n    sendJSON(res, 200, {\n      query: parsed.query,\n      top_k: topK,\n      results,\n      audit\n    });"
          new_query = "    if (!parsed || typeof parsed !== 'object') {\n      sendJSON(res, 400, { error: 'InvalidRequest', message: 'Body must be a JSON object' });\n      return;\n    }\n    if (typeof parsed.operation === 'string' && parsed.operation.trim()) {\n      try {\n        const result = engine.structured(parsed);\n        sendJSON(res, 200, { mode: 'governance-v1', request: parsed, result });\n      } catch (structuredErr) {\n        sendJSON(res, 400, { error: 'InvalidStructuredRequest', message: structuredErr.message || 'Invalid structured request' });\n      }\n      return;\n    }\n    if (typeof parsed.query !== 'string') {\n      sendJSON(res, 400, { error: 'InvalidRequest', message: 'Body must include string field \\\"query\\\" or structured field \\\"operation\\\"' });\n      return;\n    }\n    const requestedTopK = parsed.top_k;\n    const { results, audit, topK } = engine.search(parsed.query, { topK: requestedTopK });\n    sendJSON(res, 200, {\n      query: parsed.query,\n      top_k: topK,\n      results,\n      audit\n    });"
          if old_query not in s:
              raise SystemExit('handleQuery patch marker not found')
          s = s.replace(old_query, new_query)
          p.write_text(s)
          PY
      - name: Run structured retrieval test
        run: node tests/governance-retrieval.test.js
      - name: Run CI integrity tests
        run: bash scripts/ci-run-tests.sh
      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/http-engine-adapter.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: expose governance-v1 structured retrieval over production query endpoint"
          git push
