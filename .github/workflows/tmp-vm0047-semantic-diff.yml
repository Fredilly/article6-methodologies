name: Temporary VM0047 v1.0-v1.1 full text diff

on:
  push:
    branches:
      - gov-v1-vm0047-v1-1-14-semantic-diff

permissions:
  contents: write

jobs:
  diff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Extract and compare governed sources
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          V10=tools/Verra/VM0047/v1-0/source.pdf
          V11=tools/Verra/VM0047/v1-1/source.pdf
          test -f "$V10"
          test -f "$V11"
          mkdir -p docs/roadmaps/governance-v1/staging/VM0047/v1-1/diff-evidence
          pdftotext -layout "$V10" /tmp/v10.txt
          pdftotext -layout "$V11" /tmp/v11.txt
          cp /tmp/v10.txt docs/roadmaps/governance-v1/staging/VM0047/v1-1/diff-evidence/v1-0.source.layout.txt
          diff -u /tmp/v10.txt /tmp/v11.txt > docs/roadmaps/governance-v1/staging/VM0047/v1-1/diff-evidence/v1-0_to_v1-1.full-text.diff || true
          python - <<'PY'
          import hashlib,json,pathlib,re
          root=pathlib.Path('docs/roadmaps/governance-v1/staging/VM0047/v1-1/diff-evidence')
          v10=pathlib.Path('/tmp/v10.txt').read_text(errors='replace')
          v11=pathlib.Path('/tmp/v11.txt').read_text(errors='replace')
          d=(root/'v1-0_to_v1-1.full-text.diff').read_bytes()
          def stats(s):
              return {'chars':len(s),'lines':len(s.splitlines()),'words':len(re.findall(r'\S+',s))}
          out={
            'component':'Verra/VM0047',
            'from_version':'v1-0','to_version':'v1-1',
            'comparison_method':'pdftotext -layout + diff -u on governed repository PDFs',
            'source_artifacts':{
              'v1-0':{'path':'tools/Verra/VM0047/v1-0/source.pdf','sha256':hashlib.sha256(pathlib.Path('tools/Verra/VM0047/v1-0/source.pdf').read_bytes()).hexdigest(),'text_stats':stats(v10)},
              'v1-1':{'path':'tools/Verra/VM0047/v1-1/source.pdf','sha256':hashlib.sha256(pathlib.Path('tools/Verra/VM0047/v1-1/source.pdf').read_bytes()).hexdigest(),'text_stats':stats(v11)}
            },
            'full_text_diff':{'path':'diff-evidence/v1-0_to_v1-1.full-text.diff','sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d)},
            'semantic_review_status':'FULL_TEXT_EVIDENCE_GENERATED_SEMANTIC_CLASSIFICATION_SEPARATE'
          }
          (root/'full-text-comparison.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Commit comparison evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmaps/governance-v1/staging/VM0047/v1-1/diff-evidence
          git commit -m "test: record VM0047 v1.0-v1.1 full-text diff evidence"
          git push
