name: Temporary VM0047 v1.1 production corpus integration

on:
  push:
    branches:
      - gov-v1-vm0047-v1-1-15-production-corpus

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.11.1'
      - name: Generate canonical production artifacts
        run: python scripts/tmp-vm0047-production-corpus.py
      - name: Validate rich artifacts
        run: npm run validate:rich
      - name: Validate lean artifacts
        run: npm run validate:lean
      - name: Commit production corpus artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add methodologies/Verra/AFOLU/VM0047/v1-1
          git commit -m "feat: integrate VM0047 v1.1 into production corpus"
          git push
