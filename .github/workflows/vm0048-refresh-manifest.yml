name: vm0048-refresh-manifest
on:
  push:
    branches:
      - governance/vm0048-v1-0-ingestion
    paths:
      - '.github/workflows/vm0048-refresh-manifest.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: governance/vm0048-v1-0-ingestion
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.11.1'
          cache: npm
      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            if [[ "$attempt" == "3" ]]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Rebuild manifest
        run: node scripts/build-manifest.mjs
      - name: Commit manifest if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- manifest/index.json; then
            echo 'manifest already current'
            exit 0
          fi
          git config user.name 'article6-governance-bot'
          git config user.email 'fredilly@article6.org'
          git add manifest/index.json
          git commit -m 'Governance: refresh manifest for VM0048 v1.0'
          for attempt in 1 2 3; do
            if git push origin HEAD:governance/vm0048-v1-0-ingestion; then exit 0; fi
            if [[ "$attempt" == "3" ]]; then exit 1; fi
            sleep $((attempt * 20))
            git pull --rebase origin governance/vm0048-v1-0-ingestion
          done
