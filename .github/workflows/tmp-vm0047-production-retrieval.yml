name: Temporary VM0047 production retrieval execution

on:
  push:
    branches:
      - gov-v1-vm0047-v1-1-12-production-retrieval

permissions:
  contents: write

jobs:
  retrieval:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute canonical production retrieval interfaces
        run: |
          set -euo pipefail
          mkdir -p .tmp-vm0047-retrieval
          node bin/mrv-cli.js "VM0047 v1.1 census-based planting density limit" --k 5 > .tmp-vm0047-retrieval/cli-density.txt 2>&1 || true
          node bin/mrv-cli.js "VM0047 VMD0054 leakage most recent version" --k 5 > .tmp-vm0047-retrieval/cli-dependency.txt 2>&1 || true
          node bin/mrv-cli.js "VT0005 does not apply VM0047" --k 5 > .tmp-vm0047-retrieval/cli-negative.txt 2>&1 || true
          node bin/http-engine-adapter.js --port 3030 > .tmp-vm0047-retrieval/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3030/healthz > .tmp-vm0047-retrieval/healthz.json; then break; fi
            sleep 1
          done
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"query":"VM0047 v1.1 census-based planting density limit","top_k":5}' \
            http://127.0.0.1:3030/query > .tmp-vm0047-retrieval/http-density.json
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"query":"VM0047 VMD0054 leakage most recent version","top_k":5}' \
            http://127.0.0.1:3030/query > .tmp-vm0047-retrieval/http-dependency.json
          python - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path('.tmp-vm0047-retrieval')
          def txt(n): return (p/n).read_text(errors='replace') if (p/n).exists() else ''
          def js(n):
              try: return json.loads(txt(n))
              except Exception: return None
          cli_density=txt('cli-density.txt')
          cli_dep=txt('cli-dependency.txt')
          cli_neg=txt('cli-negative.txt')
          http_density=js('http-density.json')
          http_dep=js('http-dependency.json')
          health=js('healthz.json')
          serialized='\n'.join([cli_density,cli_dep,cli_neg,json.dumps(http_density),json.dumps(http_dep)])
          vm0047_visible='VM0047@v1-1' in serialized or 'VM0047@v1.1' in serialized
          # The production engine discovers only methodologies/** with META.json + sections.json + rules.json.
          # VM0047 v1.1 is still in governance staging, so absence is a real production-corpus result.
          cases=[
            {'id':'engine_health','state':'PASS' if isinstance(health,dict) and health.get('status')=='ok' else 'FAIL','observed':health},
            {'id':'vm0047_v1_1_rule_retrieval','state':'PASS' if vm0047_visible else 'FAIL','expected':'VM0047 v1.1 returned from canonical production corpus','observed':'VM0047 v1.1 not visible in production retrieval results' if not vm0047_visible else 'VM0047 v1.1 visible'},
            {'id':'structured_identity_version_dependency_contract','state':'FAIL','expected':'production interface returns exact component/version/dependency/provenance contract','observed':'current BM25 production interface ranks rule text and does not expose the governance-v1 structured identity/version/dependency contract'}
          ]
          out={
            'component':'Verra/VM0047@v1-1',
            'execution_interface':['bin/mrv-cli.js','bin/http-engine-adapter.js /healthz','bin/http-engine-adapter.js /query'],
            'execution_mode':'ACTUAL_PRODUCTION_CODE_PATH_ON_PR_CORPUS',
            'healthz':health,
            'cases':cases,
            'all_required_cases_pass':all(c['state']=='PASS' for c in cases),
            'promotion_allowed':False,
            'blocking_reason':'VM0047 v1.1 is not yet in the production methodologies corpus and the current retrieval interface cannot satisfy the full governance-v1 structured answer contract.',
            'raw_evidence':{
              'cli_density':cli_density[:4000],
              'cli_dependency':cli_dep[:4000],
              'cli_negative_dependency':cli_neg[:4000],
              'http_density':http_density,
              'http_dependency':http_dep
            }
          }
          root=pathlib.Path('docs/roadmaps/governance-v1/staging/VM0047/v1-1')
          (root/'retrieval-execution.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Commit execution evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmaps/governance-v1/staging/VM0047/v1-1/retrieval-execution.json
          git commit -m "test: record VM0047 production retrieval execution"
          git push
