name: Temporary VM0047 v1.1 registry sync

on:
  push:
    branches:
      - gov-v1-vm0047-v1-1-15-production-corpus

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Add VM0047 v1.1 registry entry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('registry.json')
          reg = json.loads(p.read_text())
          for e in reg:
              if e.get('standard') == 'Verra' and e.get('program') == 'AFOLU' and e.get('code') == 'VM0047':
                  e['latest'] = (e.get('version') == '1.1')
          if not any(e.get('path') == 'methodologies/Verra/AFOLU/VM0047/v1-1' and e.get('version') == '1.1' for e in reg):
              reg.append({
                  'kind': 'active',
                  'standard': 'Verra',
                  'program': 'AFOLU',
                  'code': 'VM0047',
                  'version': '1.1',
                  'path': 'methodologies/Verra/AFOLU/VM0047/v1-1',
                  'stage': 'active',
                  'latest': True,
                  'source_pdf': {
                      'path': 'tools/Verra/VM0047/v1-1/source.pdf',
                      'sha256': '2fdccb9764a0b06283e974142d0ff250910f81686dc53bcc197f6cf90d53de3d'
                  }
              })
          p.write_text(json.dumps(reg, indent=2) + '\n')
          PY
      - name: Validate registry integrity
        run: node scripts/check-trio-and-registry.js
      - name: Commit registry
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: register VM0047 v1.1 production corpus"
          git push
