name: Temporary VM0047 source remediation
on:
  push:
    branches: [gov-v1-18-vm0047-source-resolution-remediation]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Resolve governed section and rule source spans
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, hashlib
          from difflib import SequenceMatcher
          from pathlib import Path
          ROOT=Path('.')
          COMP=ROOT/'methodologies/Verra/AFOLU/VM0047/v1-1'
          SOURCE_REL='docs/roadmaps/governance-v1/staging/VM0047/v1-1/source/source.layout.txt'
          SOURCE=ROOT/SOURCE_REL
          raw=SOURCE.read_text(errors='replace').split('\n')
          page=1; meta=[]
          for i,line in enumerate(raw,1):
              if '\f' in line: page += line.count('\f')
              meta.append({'line':i,'page':page,'text':line.replace('\f','')})
          def norm(s): return re.sub(r'\s+',' ',str(s or '')).strip()
          def canon(s): return re.sub(r'[^a-z0-9]+',' ',norm(s).lower()).strip()
          def toks(s): return set(re.findall(r'[a-z0-9]+',canon(s)))
          STOP={'the','and','or','of','to','a','an','in','for','with','by','on','at','as','is','are','be','must','shall','may','this','that','from','using','used','project','projects','approach','based'}
          def meaningful(s): return {t for t in toks(s) if t not in STOP and len(t)>2}
          sections=json.loads((COMP/'sections.rich.json').read_text())
          resolved={}; failures=[]
          for s in sections:
              title=norm(s.get('title')); num=norm(s.get('section_number')); pages=set(s.get('pages') or []); best=None
              for idx,row in enumerate(meta):
                  if pages and row['page'] not in pages: continue
                  if not norm(row['text']): continue
                  for width in (1,2,3):
                      chunk=meta[idx:idx+width]
                      if len(chunk)!=width or any(pages and x['page'] not in pages for x in chunk): continue
                      text=norm(' '.join(x['text'] for x in chunk)); ctext,ctitle=canon(text),canon(title)
                      if not ctext: continue
                      seq=SequenceMatcher(None,ctitle,ctext).ratio(); tt=meaningful(title)
                      overlap=len(tt & meaningful(text))/max(1,len(tt)); nb=0
                      if num:
                          variants={canon(num),canon(num.replace('A','Appendix ')),canon(num.replace('A-','Appendix '))}
                          if any(v and (ctext.startswith(v+' ') or ctext==v) for v in variants): nb=.20
                      ab=.15 if (num.upper().startswith('A') and 'appendix' in ctext) else 0
                      cand=(.58*overlap+.42*seq+nb+ab,row['line'],chunk[-1]['line'],text)
                      if best is None or cand[0]>best[0]: best=cand
              if best is None or best[0]<.70:
                  failures.append(f"section {s.get('id')} unresolved heading: best={best}"); continue
              resolved[s['id']]={'start':best[1],'heading_end':best[2],'heading_text':best[3],'score':best[0]}
          if failures: raise SystemExit('\n'.join(failures))
          by_start=sorted([(resolved[s['id']]['start'],s) for s in sections],key=lambda x:x[0])
          for pos,(start,s) in enumerate(by_start):
              level=int(s.get('section_level') or s.get('level') or 1); end=len(raw)
              for nxt_start,nxt in by_start[pos+1:]:
                  if int(nxt.get('section_level') or nxt.get('level') or 1)<=level:
                      end=nxt_start-1; break
              pmax=max(s.get('pages') or [10**9])
              while end>=start and meta[end-1]['page']>pmax: end-=1
              if end<start: end=start
              span_text=norm(' '.join(x['text'] for x in meta[start-1:end]))
              if len(span_text)<20: raise SystemExit(f"section {s['id']} resolved span is not substantive")
              quote=norm(resolved[s['id']]['heading_text'])
              s.setdefault('provenance',{})['lines']=[f'{SOURCE_REL}#L{start}-L{end}']
              s['locators']=[{'kind':'governed_text_lines','quote':quote}]
              resolved[s['id']]['end']=end
          rules=json.loads((COMP/'rules.rich.json').read_text())
          for r in rules:
              sid=(r.get('refs') or {}).get('primary_section')
              if sid not in resolved: raise SystemExit(f"rule {r.get('id')} references unresolved section {sid}")
              sec=resolved[sid]; logic=norm(r.get('logic')); target=meaningful(logic)|meaningful(r.get('summary')); candidates=[]
              for start in range(sec['start'],sec['end']+1):
                  for width in range(1,13):
                      end=min(sec['end'],start+width-1)
                      if end-start+1!=width: continue
                      text=norm(' '.join(x['text'] for x in meta[start-1:end]))
                      if len(text)<25: continue
                      mt=meaningful(text); overlap_terms=target & mt
                      if len(overlap_terms)<2: continue
                      coverage=len(overlap_terms)/max(1,len(target)); precision=len(overlap_terms)/max(1,len(mt)); seq=SequenceMatcher(None,canon(logic),canon(text)).ratio()
                      score=.55*coverage+.20*precision+.25*seq-.002*(width-1)
                      candidates.append({'score':score,'terms':overlap_terms,'start':start,'end':end,'text':text})
              if not candidates: raise SystemExit(f"rule {r.get('id')} has no governed-text evidence candidate")
              # Greedily select up to four non-overlapping exact spans. This supports parameter-table
              # requirements that are genuinely distributed across method, QA/QC, threshold and frequency rows.
              selected=[]; covered=set()
              remaining=list(candidates)
              for _ in range(4):
                  viable=[]
                  for c in remaining:
                      if any(not (c['end']<s['start'] or c['start']>s['end']) for s in selected): continue
                      gain=len(c['terms']-covered)
                      if gain<=0: continue
                      viable.append((gain,c['score'],c))
                  if not viable: break
                  viable.sort(key=lambda x:(x[0],x[1]),reverse=True)
                  c=viable[0][2]; selected.append(c); covered |= c['terms']
                  if len(covered)>=max(3,min(8,len(target)//2)): break
              selected.sort(key=lambda c:c['start'])
              if len(covered)<3:
                  raise SystemExit(f"rule {r.get('id')} evidence too weak after multi-span resolution: covered={len(covered)}")
              line_refs=[f"{SOURCE_REL}#L{c['start']}-L{c['end']}" for c in selected]
              source_text=norm(' '.join(c['text'] for c in selected))
              locators=[{'kind':'governed_text_lines','quote':' '.join(c['text'].split()[:18])} for c in selected]
              actual_pages=sorted({meta[i-1]['page'] for c in selected for i in range(c['start'],c['end']+1)})
              r['source_span_text']=source_text
              r.setdefault('refs',{})['lines']=line_refs
              r['refs']['locators']=locators
              r['refs']['pages']=actual_pages
          (COMP/'sections.rich.json').write_text(json.dumps(sections,indent=2,ensure_ascii=False)+'\n')
          (COMP/'rules.rich.json').write_text(json.dumps(rules,indent=2,ensure_ascii=False)+'\n')
          meta_json=json.loads((COMP/'META.json').read_text())
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          sr=sha(COMP/'sections.rich.json'); rr=sha(COMP/'rules.rich.json')
          meta_json['audit_hashes']['sections.rich_sha256']=sr; meta_json['audit_hashes']['rules.rich_sha256']=rr
          for item in meta_json.get('files',[]):
              if item.get('path')=='sections.rich.json': item['sha256']=sr
              if item.get('path')=='rules.rich.json': item['sha256']=rr
          meta_json['governance_v1']['migration_note']='VM0047 v1.1 is VERIFIED with governed-text-resolvable section content and exact rule evidence spans under governance-v1 source-resolution invariants.'
          (COMP/'META.json').write_text(json.dumps(meta_json,indent=2,ensure_ascii=False)+'\n')
          print(f"resolved sections={len(sections)} rules={len(rules)}")
          PY
      - name: Validate source-resolution invariant
        run: node scripts/check-governance-source-resolution.js methodologies/Verra/AFOLU/VM0047/v1-1
      - name: Validate canonical artifacts
        run: |
          npm ci --ignore-scripts
          npm run validate:rich
          npm run validate:lean
          node scripts/check-trio-and-registry.js
          node scripts/build-manifest.mjs
      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add methodologies/Verra/AFOLU/VM0047/v1-1/META.json methodologies/Verra/AFOLU/VM0047/v1-1/sections.rich.json methodologies/Verra/AFOLU/VM0047/v1-1/rules.rich.json manifest/index.json
          git commit -m "fix: resolve VM0047 sections and rules to governed source text"
          git push
