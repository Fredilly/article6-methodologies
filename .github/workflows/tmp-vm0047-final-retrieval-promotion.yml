name: Temporary VM0047 final retrieval promotion

on:
  push:
    branches:
      - gov-v1-vm0047-v1-1-16-structured-retrieval

permissions:
  contents: write

jobs:
  execute-and-promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
      - name: Enrich structured source metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/governance-retrieval.js')
          s = p.read_text()
          old = '''  function sourceInfo(component) {
            const source = (((component.meta || {}).provenance || {}).source_pdfs || [])[0] || null;
            if (!source) return null;
            const abs = path.join(ROOT, source.path || '');
            return {
              doc: source.doc || null,
              kind: source.kind || null,
              governed_path: source.path || null,
              sha256: source.sha256 || null,
              size: source.size || null,
              governed_pdf_present: Boolean(source.path && exists(abs))
            };
          }'''
          new = '''  function sourceInfo(component) {
            const source = (((component.meta || {}).provenance || {}).source_pdfs || [])[0] || null;
            if (!source) return null;
            const abs = path.join(ROOT, source.path || '');
            const version = normalizeVersion(component.entry.version);
            const discoveryPath = path.join(ROOT, 'docs', 'roadmaps', 'governance-v1', 'staging', component.entry.code, version, 'META.discovery.json');
            let artifact = null;
            if (exists(discoveryPath)) {
              const discovery = readJSON(discoveryPath);
              artifact = discovery && discovery.source_artifact ? discovery.source_artifact : null;
            }
            return {
              doc: source.doc || null,
              kind: source.kind || null,
              governed_path: source.path || null,
              sha256: source.sha256 || null,
              size: source.size || null,
              artifact_filename: artifact ? artifact.filename || null : null,
              page_count: artifact ? artifact.page_count || null : null,
              governed_pdf_present: Boolean(source.path && exists(abs))
            };
          }'''
          if old not in s:
              if 'artifact_filename: artifact ? artifact.filename || null : null' not in s:
                  raise SystemExit('sourceInfo patch marker not found')
          else:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Pre-promotion structured unit contract
        run: node tests/governance-retrieval.test.js
      - name: Start production HTTP adapter
        run: |
          node bin/http-engine-adapter.js --port 3030 > /tmp/vm0047-engine.log 2>&1 &
          echo $! > /tmp/vm0047-engine.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3030/healthz > /tmp/health.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/vm0047-engine.log
          exit 1
      - name: Execute canonical structured retrieval suite and promote
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT = Path('.')
          STAGING = ROOT / 'docs/roadmaps/governance-v1/staging/VM0047/v1-1'
          PROD_META = ROOT / 'methodologies/Verra/AFOLU/VM0047/v1-1/META.json'
          DISCOVERY = STAGING / 'META.discovery.json'
          PROMOTION = STAGING / 'promotion-gates.json'
          TESTS = STAGING / 'retrieval-tests.json'
          EVIDENCE = STAGING / 'retrieval-execution.json'
          SHA = '2fdccb9764a0b06283e974142d0ff250910f81686dc53bcc197f6cf90d53de3d'

          def post(payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request('http://127.0.0.1:3030/query', data=data, headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  body = json.loads(r.read().decode())
              assert body.get('mode') == 'governance-v1', body
              return body['result']

          with urllib.request.urlopen('http://127.0.0.1:3030/healthz', timeout=10) as r:
              health = json.loads(r.read().decode())
          assert health['status'] == 'ok' and health['documents'] > 0, health

          requests = {
              'identity': {'operation':'identity','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1'},
              'version_selection_current': {'operation':'version','standard':'Verra','program':'AFOLU','code':'VM0047'},
              'version_selection_historical': {'operation':'version','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-0'},
              'section_retrieval': {'operation':'section','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1','section_number':'4.3'},
              'deep_section_retrieval': {'operation':'section','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1','section_number':'9.3.1'},
              'rule_retrieval': {'operation':'rule','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1','rule_id':'R-4-3-0002'},
              'dependency_traversal': {'operation':'dependency','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1','target':'Verra/VMD0054'},
              'negative_dependency': {'operation':'dependency','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1','target':'Verra/VT0005'},
              'source_hash': {'operation':'source','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1'},
              'version_diff': {'operation':'version_diff','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1','from_version':'v1-0'},
              'negative_no_verified_rules': {'operation':'rules','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1','require_verified':True},
              'ambiguity': {'operation':'rules','standard':'Verra','program':'AFOLU','code':'VM0047','require_verified':True}
          }
          pre = {k: post(v) for k,v in requests.items()}

          assert pre['identity']['code'] == 'VM0047' and pre['identity']['version'] == 'v1-1'
          assert pre['identity']['status'] == 'Active' and pre['identity']['effective_from'] == '2025-05-14'
          assert pre['version_selection_current']['version'] == 'v1-1' and pre['version_selection_current']['latest'] is True
          assert pre['version_selection_historical']['version'] == 'v1-0'
          assert pre['section_retrieval']['section']['section_number'] == '4.3'
          assert pre['section_retrieval']['section']['title'] == 'Census-based Approach Applicability Conditions'
          assert pre['deep_section_retrieval']['section']['section_number'] == '9.3.1'
          assert pre['deep_section_retrieval']['section']['title'] == 'Database Requirements for Project and Control Plots'
          assert pre['deep_section_retrieval']['section']['pages'] == [62,63]
          rule = pre['rule_retrieval']['rule']
          assert rule['id'].endswith('.R-4-3-0002') and '50 planting units per hectare' in (rule.get('logic') or '').lower()
          dep = pre['dependency_traversal']['dependency']
          assert dep['target'] == 'Verra/VMD0054' and dep['relationship'] == 'MANDATORY'
          assert dep['version_policy'] == 'MOST_RECENT_AT_APPLICATION' and dep['version'] is None
          assert pre['negative_dependency']['applies'] is False and pre['negative_dependency']['answer'] == 'no'
          assert pre['negative_dependency']['non_dependency']['source_page'] == 47
          src = pre['source_hash']['source']
          assert src['sha256'] == SHA and src['governed_path'] == 'tools/Verra/VM0047/v1-1/source.pdf'
          assert src['governed_pdf_present'] is True and src['artifact_filename'] == 'VM0047-v1.1_Final.pdf' and src['page_count'] == 81
          diff = pre['version_diff']['diff']
          assert diff['material_change_count'] == 11
          assert all(x in diff['change_types'] for x in ['MODIFIED','ADDED','TOOL_CHANGED'])
          assert pre['negative_no_verified_rules']['answer'] is None
          assert pre['negative_no_verified_rules']['verification_status'] == 'not_verified'
          assert pre['negative_no_verified_rules']['uncertainty'] == 'explicit'
          assert pre['ambiguity']['version'] == 'v1-1' and pre['ambiguity']['production_rules_returned'] is False

          promotion = json.loads(PROMOTION.read_text())
          for gate in promotion['gates']:
              if gate['gate'] == 'production_retrieval_execution':
                  gate['current_state'] = 'PASS'
                  gate['evidence'] = 'Canonical production HTTP /query structured operations passed identity, current/historical version selection, section, deep-section, atomic rule, dependency, explicit non-dependency, governed-source provenance, semantic version-diff, explicit pre-promotion not_verified behavior, and current-version ambiguity resolution.'
                  gate.pop('blocker', None)
          assert all(g['current_state'] == 'PASS' for g in promotion['gates'])
          promotion['current_state'] = 'VERIFIED'
          promotion['verified'] = True
          promotion['promotion_allowed'] = True
          promotion['promotion_rule'] = 'All governance-v1 promotion gates are PASS; VM0047 v1.1 is eligible for and has completed VERIFIED promotion.'

          prod = json.loads(PROD_META.read_text())
          prod.setdefault('governance_v1', {})['state'] = 'VERIFIED'
          prod['governance_v1']['verified'] = True
          prod['governance_v1']['production_corpus'] = True
          prod['governance_v1']['blockers'] = []
          prod['governance_v1']['migration_note'] = 'VM0047 v1.1 passed all governance-v1 gates, including canonical production structured retrieval execution, and is VERIFIED.'

          discovery = json.loads(DISCOVERY.read_text())
          discovery.setdefault('governance_v1', {})['state'] = 'VERIFIED'
          discovery['governance_v1']['verified'] = True
          discovery['governance_v1']['production_corpus'] = True
          discovery['governance_v1']['blockers'] = []
          discovery['governance_v1']['migration_note'] = 'Authoritative source capture, source-audited hierarchy, atomic rules, exact provenance, dependency semantics, semantic version diff and canonical production retrieval execution are complete. VM0047 v1.1 is VERIFIED.'

          PROD_META.write_text(json.dumps(prod, indent=2) + '\n')
          DISCOVERY.write_text(json.dumps(discovery, indent=2) + '\n')
          PROMOTION.write_text(json.dumps(promotion, indent=2) + '\n')

          post_verify = {
              'identity': post({'operation':'identity','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1'}),
              'verified_rules': post({'operation':'rules','standard':'Verra','program':'AFOLU','code':'VM0047','version':'v1-1','require_verified':True}),
              'current_rules': post({'operation':'rules','standard':'Verra','program':'AFOLU','code':'VM0047','require_verified':True})
          }
          assert post_verify['identity']['verified'] is True and post_verify['identity']['verification_status'] == 'verified'
          assert post_verify['verified_rules']['verification_status'] == 'verified'
          assert post_verify['verified_rules']['production_rules_returned'] is True
          assert len(post_verify['verified_rules']['rules']) > 0
          assert post_verify['current_rules']['version'] == 'v1-1' and post_verify['current_rules']['verified'] is True

          tests = json.loads(TESTS.read_text())
          tests['execution_status'] = 'PRODUCTION_STRUCTURED_RETRIEVAL_PASSED_AND_VERIFIED'
          tests['execution_evidence'] = 'retrieval-execution.json'
          for case in tests['cases']:
              if case['id'] == 'negative_no_verified_rules':
                  case['engine_execution_status'] = 'PASS_PRE_PROMOTION_SAFETY'
                  case['note'] = 'Executed before VERIFIED promotion through the canonical production HTTP interface; explicit not_verified and uncertainty were returned and no production rules were emitted.'
              elif case['id'] == 'ambiguity':
                  case['engine_execution_status'] = 'PASS'
                  case['expected']['verification_status'] = 'verified'
                  case['expected']['production_rules_returned'] = True
              elif case['id'] == 'source_provenance':
                  case['engine_execution_status'] = 'PASS'
                  case['expected']['promotion_allowed'] = True
                  case['note'] = 'Governed PDF presence and SHA were confirmed through the canonical production source lookup; promotion is allowed only after all gates passed.'
              else:
                  case['engine_execution_status'] = 'PASS'
          tests['promotion_rule'] = 'All required canonical production retrieval cases passed. VERIFIED remains valid only while every governance-v1 promotion gate remains PASS.'
          TESTS.write_text(json.dumps(tests, indent=2) + '\n')

          evidence = {
              'component': 'Verra/VM0047@v1-1',
              'executed_at_utc': datetime.now(timezone.utc).isoformat(),
              'production_interface': 'bin/http-engine-adapter.js POST /query',
              'mode': 'governance-v1',
              'engine_health': health,
              'pre_promotion': {
                  'verified_before_execution': False,
                  'requests': requests,
                  'responses': pre,
                  'all_required_cases_passed': True,
                  'explicit_not_verified_safety_passed': True
              },
              'promotion': {
                  'all_gates_pass': True,
                  'promotion_allowed': True,
                  'promoted_state': 'VERIFIED'
              },
              'post_promotion_confirmation': post_verify,
              'all_required_cases_pass': True
          }
          EVIDENCE.write_text(json.dumps(evidence, indent=2) + '\n')
          print('VM0047 v1.1 structured production retrieval suite passed; VERIFIED promotion confirmed')
          PY
      - name: Update final structured retrieval test expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/governance-retrieval.test.js')
          s = p.read_text()
          old = '''const verifiedOnly = retriever.query({ operation: 'rules', standard: 'Verra', program: 'AFOLU', code: 'VM0047', version: 'v1-1', require_verified: true });
          assert.strictEqual(verifiedOnly.answer, null);
          assert.strictEqual(verifiedOnly.verification_status, 'not_verified');
          assert.strictEqual(verifiedOnly.uncertainty, 'explicit');
          assert.strictEqual(verifiedOnly.production_rules_returned, false);'''
          new = '''const verifiedOnly = retriever.query({ operation: 'rules', standard: 'Verra', program: 'AFOLU', code: 'VM0047', version: 'v1-1', require_verified: true });
          assert.strictEqual(verifiedOnly.verification_status, 'verified');
          assert.strictEqual(verifiedOnly.verified, true);
          assert.strictEqual(verifiedOnly.production_rules_returned, true);
          assert.ok(verifiedOnly.rules.length > 0);'''
          if old not in s: raise SystemExit('final test marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node tests/governance-retrieval.test.js
      - name: Validate final governed state
        run: |
          npm ci || npm i
          npm run validate:rich
          npm run validate:lean
          node scripts/check-trio-and-registry.js
      - name: Commit verified promotion evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/governance-retrieval.js \
            tests/governance-retrieval.test.js \
            methodologies/Verra/AFOLU/VM0047/v1-1/META.json \
            docs/roadmaps/governance-v1/staging/VM0047/v1-1/META.discovery.json \
            docs/roadmaps/governance-v1/staging/VM0047/v1-1/promotion-gates.json \
            docs/roadmaps/governance-v1/staging/VM0047/v1-1/retrieval-tests.json \
            docs/roadmaps/governance-v1/staging/VM0047/v1-1/retrieval-execution.json
          git commit -m "feat: verify VM0047 v1.1 production retrieval"
          git push
